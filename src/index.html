<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sober: Prebiotic Sodas</title>
<meta name="description" content="Five bold flavours of prebiotic soda. All fizz, no booze.">
<style>
@font-face{font-family:'Archivo Black';font-style:normal;font-weight:400;font-display:swap;src:url(__FONT_ARCHIVO__) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(__FONT_INTER__) format('woff2')}
@font-face{font-family:'DM Mono';font-style:normal;font-weight:400;font-display:swap;src:url(__FONT_DM400__) format('woff2')}
@font-face{font-family:'DM Mono';font-style:normal;font-weight:500;font-display:swap;src:url(__FONT_DM500__) format('woff2')}

:root{
  --sheet:url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_3GuPJgHdO30A861GfajrdQdZhaa%2Fhf_20261117_072450_85f2c906-b9bf-468c-a9da-53609a54aeb1.png&w=2200&q=85");
  --ink:#1c1a1f; --cream:#f0e8e0; --dark:#191a1e; --flav:#f29a63;
  --ease:cubic-bezier(.22,.8,.24,1);
  --u:min(calc(100vw / 1440), calc(100svh / 900));
  --w:calc(100vw / 1440);
  --n:min(calc(100vw / 1440), 1px);
  --mk1:var(--ink); --mk2:var(--cream);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:hidden;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
.disp{font-family:'Archivo Black',Inter,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:-.01em;line-height:.92}
.spr{background-image:var(--sheet);background-repeat:no-repeat}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#gl{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:2;pointer-events:none;display:block}

/* ---------- nav ---------- */
#nav{position:fixed;left:0;right:0;top:0;z-index:50;height:calc(94 * var(--n));padding:0 calc(37 * var(--n)) 0 calc(42 * var(--n));display:flex;align-items:center;justify-content:space-between;color:var(--ink);translate:0 -110%;transition:color .4s}
.entered #nav{translate:none;transition:translate .9s cubic-bezier(.22,.9,.24,1),color .4s}
.brand{display:flex;align-items:center;gap:calc(11 * var(--n));font-weight:800;font-size:calc(15.5 * var(--n));letter-spacing:.06em}
.mark{width:calc(36 * var(--n));height:calc(36 * var(--n));display:block;flex:none}
.mark .m1{fill:var(--mk1)} .mark .m2{fill:var(--mk2)}
.pill{position:absolute;left:50%;top:50%;translate:-50% -50%;display:flex;padding:calc(5 * var(--n));border:1.5px solid #fff;background:rgba(255,255,255,.08);border-radius:99px;transition:border-color .4s,background .4s}
.pill a{position:relative;z-index:1;display:flex;align-items:center;height:calc(34 * var(--n));padding:0 calc(19 * var(--n));font-size:calc(14.5 * var(--n));font-weight:500;border-radius:99px;transition:color .4s}
.pill a.on{font-weight:600}
.pill .hl{position:absolute;top:calc(5 * var(--n));bottom:calc(5 * var(--n));left:0;width:0;background:#fff;border-radius:99px;transition:left .5s var(--ease),width .5s var(--ease),background .4s}
#nav.light .pill{border-color:rgba(28,26,31,.14);background:rgba(255,255,255,.35)}
.right{display:flex;align-items:center;gap:calc(10 * var(--n))}
.chip{display:flex;align-items:center;justify-content:center;height:calc(37 * var(--n));border:1.5px solid currentColor;border-radius:99px;font-size:calc(13 * var(--n));font-weight:700;letter-spacing:.02em;padding:0 calc(14 * var(--n))}
.basket{position:relative;width:calc(44 * var(--n));padding:0}
.basket svg{width:calc(19 * var(--n));height:calc(19 * var(--n))}
.badge{position:absolute;top:-7px;right:-8px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--ink);color:var(--cream);font:500 10.5px/18px 'DM Mono',monospace;text-align:center;scale:0}
.badge.has{scale:1}
.dibs{display:flex;align-items:center;height:calc(37 * var(--n));padding:0 calc(18 * var(--n));border-radius:99px;background:var(--ink);color:var(--cream);font-size:calc(14.5 * var(--n));font-weight:600;transition:background .4s,color .4s}
#nav.dark{color:var(--cream);--mk1:var(--cream);--mk2:var(--ink)}
#nav.dark .pill{border-color:rgba(240,232,224,.5);background:rgba(255,255,255,.06)}
#nav.dark .pill a.on{color:var(--ink)}
#nav.dark .pill .hl{background:var(--cream)}
#nav.dark .dibs{background:#8fa8a3;color:var(--ink)}
#nav.dark .badge{background:var(--cream);color:var(--ink)}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:100;background:#f09057;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
#intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#intro.logo{background:var(--cream)}
#intro.logo video{visibility:hidden}
#intro.out{opacity:0;pointer-events:none}
#intro.gone{display:none}
#skip{position:absolute;top:calc(28 * var(--u));right:calc(36 * var(--u));height:38px;padding:0 18px;border-radius:99px;background:rgba(255,255,255,.9);font:500 12px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;z-index:2}
#intro.logo #skip{display:none}
.stamp{display:none;align-items:center;gap:calc(26 * var(--u));position:relative;z-index:1}
.stamp .mark{width:calc(120 * var(--u));height:calc(120 * var(--u))}
.stamp span{font-weight:800;font-size:calc(72 * var(--u));letter-spacing:.06em}
#intro.logo .stamp{display:flex;animation:pop .38s ease-out both}
@keyframes pop{0%{scale:.72;opacity:0}70%{scale:1.04;opacity:1}100%{scale:1;opacity:1}}

/* ---------- hero ---------- */
#flavors{position:relative;height:100svh;min-height:300px;overflow:hidden;background:var(--flav)}
.reveal{position:absolute;inset:0;background:var(--rv,transparent);clip-path:circle(0 at 50% 50%)}
.rings{position:absolute;left:50%;top:41%;width:calc(2200 * var(--u));height:calc(2200 * var(--u));translate:-50% -50%;
  background:repeating-radial-gradient(circle,rgba(255,255,255,.13) 0,rgba(255,255,255,.02) calc(40 * var(--u)),rgba(255,255,255,.13) calc(80 * var(--u)));
  -webkit-mask-image:radial-gradient(circle,#000 0 22%,rgba(0,0,0,.55) 34%,transparent 52%);mask-image:radial-gradient(circle,#000 0 22%,rgba(0,0,0,.55) 34%,transparent 52%);
  opacity:0;scale:.85}
.entered .rings{opacity:1;scale:1;transition:opacity 1.1s ease-out,scale 1.1s ease-out}
.bits{position:absolute;inset:0;pointer-events:none}
.bit{position:absolute;filter:blur(1.5px);opacity:0;translate:-50% -50%}
.arc{position:absolute;inset:0;touch-action:pan-y;cursor:grab}
.hui{opacity:0}
.entered #play{opacity:1;transition:opacity .6s .5s,scale .25s var(--ease)}
.entered #count{opacity:1;transition:opacity .6s .62s}
.entered #auto{opacity:1;transition:opacity .6s .74s}
#play{position:absolute;left:50%;top:calc(50% + 200 * var(--u));width:calc(52 * var(--u));height:calc(52 * var(--u));min-width:40px;min-height:40px;translate:-50% -50%;border-radius:50%;background:#fff;box-shadow:0 6px 20px rgba(40,28,60,.12);display:grid;place-items:center;z-index:60;color:var(--ink)}
#play svg{width:max(14px,calc(18 * var(--u)));height:max(14px,calc(18 * var(--u)));transition:translate .25s var(--ease)}
#play:hover{scale:1.08} #play:hover svg{translate:2px 0} #play:active{scale:.94}
#title{position:absolute;left:0;right:0;top:calc(50% + 265 * var(--u));margin:0;text-align:center;font-size:var(--ts,calc(96 * var(--u)));color:var(--ink);z-index:60;pointer-events:none;white-space:normal}
#title .tl{display:block}
#title .tl.old{position:absolute;left:0;right:0;top:0}
#title .tw{display:inline-block;white-space:nowrap}
#title .tw>span{display:inline-block}
#count{position:absolute;top:calc(50% + 215 * var(--u));right:calc(50% - 692 * var(--u));font-size:calc(200 * var(--u));line-height:.9;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.9);z-index:1;pointer-events:none}
#auto{position:absolute;right:calc(50% - 680 * var(--u));top:calc(50% + 170 * var(--u));display:flex;align-items:center;gap:10px;z-index:60;color:#fff;font:500 11px 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
#auto .ring{width:26px;height:26px;border-radius:50%;border:1.3px solid #fff;display:grid;place-items:center}
#auto .ring svg{width:10px;height:10px}
#auto .pl{display:none} #auto[aria-pressed="false"] .pl{display:block} #auto[aria-pressed="false"] .pa{display:none}

/* ---------- section 2 ---------- */
#inside{position:relative;height:500vh;background:var(--flav)}
.pin{position:sticky;top:0;height:100svh;overflow:hidden}
.in-dark{position:absolute;inset:0;background:#120d16;opacity:0}
.in-frame{position:absolute;left:50%;top:50%;width:1440px;height:900px;transform:translate(-50%,-50%) scale(var(--k,1))}
.in-num{position:absolute;left:510px;top:240px;width:640px;text-align:center;font-size:428px;color:transparent;-webkit-text-stroke:1.6px #fff;margin:0}
#inCan{position:absolute;left:685px;top:110px;width:290px;height:694px}
#inFront{position:fixed;left:0;top:0;width:100vw;height:100svh;z-index:3;pointer-events:none;overflow:hidden;visibility:hidden}
#inFront.vis{visibility:visible}
.in-head{position:absolute;left:40px;top:300px;margin:0;font-size:88px;line-height:.93;color:var(--cream)}
.in-head .lw{font-size:.72em}
.in-icons{position:absolute;left:1292px;top:310px;display:grid;gap:4px}
.in-icons button{width:66px;height:66px;border-radius:50%;border:1.5px solid #fff;color:#fff;display:grid;place-items:center;pointer-events:auto;transition:background .35s,color .35s,border-color .35s}
.in-icons button svg{width:26px;height:26px}
.in-icons button.on{background:var(--cream);border-color:var(--cream);color:var(--ink)}
.in-cap{position:absolute;right:42px;top:596px;margin:0;text-align:right;font:400 14px/1.6 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.92)}
.storm{position:absolute;inset:0}
.sp{position:absolute;left:0;top:0;visibility:hidden;will-change:transform,opacity}

/* ---------- shop ---------- */
#shop{position:relative;background:var(--cream);padding:calc(96 * var(--w)) calc(39 * var(--w)) calc(80 * var(--w))}
.ln{display:block;overflow:hidden;padding-bottom:.04em;margin-bottom:-.04em}
.ln>span{display:block;transform:translateY(105%);transition:transform 1s var(--ease)}
.ln:nth-child(2)>span{transition-delay:80ms}
.ln:nth-child(3)>span{transition-delay:160ms}
.shown .ln>span{transform:none}
.shop-h{margin:0;font-size:calc(94 * var(--w));line-height:.86}
.shop-cap{position:absolute;left:calc(1128 * var(--w));top:calc(132 * var(--w));margin:0;font:400 calc(15.5 * var(--w))/1.42 'DM Mono',monospace;opacity:0;translate:0 24px;transition:opacity 1s var(--ease),translate 1s var(--ease)}
.shown .shop-cap{opacity:1;translate:0 0}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(18 * var(--w));margin-top:calc(24 * var(--w));perspective:1200px}
.card{position:relative;height:calc(390 * var(--w));border-radius:calc(22 * var(--w));background:var(--c);transform-style:preserve-3d;opacity:0;translate:0 30px;
  transition:transform .15s,box-shadow .15s,opacity .9s var(--ease) var(--d,0ms),translate .9s var(--ease) var(--d,0ms);cursor:default}
.shown .card{opacity:1;translate:0 0}
.card .nm{position:absolute;left:0;right:0;top:calc(26 * var(--w));margin:0;text-align:center;font-size:calc(30.5 * var(--w));color:#fbf7f2;transform:translateZ(10px)}
.pk{position:absolute;left:50%;top:calc(104 * var(--w));width:calc(107 * var(--w));height:calc(255 * var(--w));transform:translateX(-50%) translateZ(30px);transform-origin:50% 100%;filter:drop-shadow(0 calc(9 * var(--w)) calc(12 * var(--w)) rgba(30,20,30,.28));cursor:pointer}
.gl .card.live .pk{visibility:hidden}
.card .cp{position:absolute;left:calc(18 * var(--w));bottom:calc(17 * var(--w));margin:0;color:#fbf7f2;font:400 max(10.5px,calc(12.5 * var(--w)))/1.3 'DM Mono',monospace;letter-spacing:.04em;transform:translateZ(20px)}
.card .cp b{font-weight:500;font-size:1.18em}
#toast{position:fixed;z-index:80;right:16px;top:calc(94 * var(--n) + 8px);display:flex;align-items:center;gap:14px;padding:10px 12px 10px 16px;border-radius:14px;background:var(--ink);color:var(--cream);font:500 13px Inter,sans-serif;box-shadow:0 10px 30px rgba(20,14,24,.25);opacity:0;translate:0 -8px;pointer-events:none;transition:opacity .3s,translate .3s var(--ease)}
#toast.on{opacity:1;translate:0 0;pointer-events:auto}
#toast a{padding:7px 12px;border-radius:99px;background:var(--cream);color:var(--ink);font-weight:700;white-space:nowrap}
.add{position:absolute;right:calc(16 * var(--w));bottom:calc(15 * var(--w));width:max(34px,calc(44 * var(--w)));height:max(34px,calc(44 * var(--w)));border-radius:50%;background:var(--ink);border:2px solid #fff;color:#fff;display:grid;place-items:center;transform:translateZ(40px);transition:scale .2s var(--ease)}
.add svg{width:42%;height:42%}
.add:hover{scale:1.1}

/* ---------- builder ---------- */
#range{position:relative;background:var(--dark);color:var(--cream);min-height:100svh;overflow:hidden;
  --pt:max(calc(92 * var(--w)),calc(94 * var(--n) + 24px),calc((100vh - 540 * var(--w)) / 2));
  padding:var(--pt) calc(50 * var(--w)) max(40px,calc((100vh - 540 * var(--w)) / 2))}
.b-h{position:relative;z-index:1;pointer-events:none;margin:0;white-space:nowrap;font-size:calc(72.5 * var(--w));line-height:.93}
.b-h .three{display:inline-grid;place-items:center;width:calc(74 * var(--w));height:calc(72 * var(--w));border-radius:calc(14 * var(--w));background:var(--cream);color:var(--dark);font-size:.86em;vertical-align:.04em;line-height:1}
.glow{position:absolute;z-index:1;left:calc(740 * var(--w));top:calc(var(--pt) - 80 * var(--w));width:calc(600 * var(--w));height:calc(600 * var(--w))}
.glow .gb{position:absolute;inset:0;border-radius:50%;--g:rgba(154,196,153,.72);background:radial-gradient(circle,var(--g) 0,color-mix(in srgb,var(--g) 50%,transparent) 32%,transparent 68%)}
.slot{position:absolute;width:calc(170 * var(--w));height:calc(240 * var(--w));translate:-50% -50%;display:grid;place-items:center}
.slot .sc{position:absolute;left:50%;top:50%;width:calc(81 * var(--w));height:calc(194 * var(--w));translate:-50% -50%;filter:drop-shadow(0 calc(10 * var(--w)) calc(14 * var(--w)) rgba(0,0,0,.45));visibility:hidden}
.slot.full .sc{visibility:visible}
.slot .x{position:relative;z-index:1;width:calc(48 * var(--w));height:calc(48 * var(--w));min-width:30px;min-height:30px;border-radius:50%;background:var(--dark);border:2px solid var(--cream);color:var(--cream);display:grid;place-items:center;transition:translate .5s var(--ease),scale .5s var(--ease);cursor:default}
.slot .x svg{width:38%;height:38%}
.slot.full .x{translate:0 calc(-108 * var(--w));scale:.85;cursor:pointer}
.thumbs{position:relative;z-index:1;display:flex;gap:calc(24 * var(--w));margin-top:calc(36 * var(--w))}
.th{display:flex;flex-direction:column;align-items:center;gap:calc(10 * var(--w));width:calc(107 * var(--w))}
.th .sq{position:relative;width:calc(107 * var(--w));height:calc(107 * var(--w));border-radius:calc(16 * var(--w));background:var(--c);display:grid;place-items:center;transition:translate .3s var(--ease)}
.th:hover .sq{translate:0 -4px}
.th .ts{width:calc(32 * var(--w));height:calc(76 * var(--w));filter:drop-shadow(0 4px 5px rgba(0,0,0,.25))}
.th .tn{font-weight:800;font-size:calc(11 * var(--w));text-transform:uppercase;letter-spacing:.04em;text-align:center;white-space:nowrap}
.th .tr{width:calc(24 * var(--w));height:calc(24 * var(--w));min-width:18px;min-height:18px;border-radius:50%;border:1.5px solid rgba(240,232,224,.5);display:grid;place-items:center;font:500 calc(11 * var(--w)) 'DM Mono',monospace}
.th .tr.on{background:var(--cream);border-color:var(--cream);color:var(--dark)}
#buy{position:relative;z-index:1;display:inline-flex;align-items:center;gap:14px;margin-top:calc(30 * var(--w));height:max(44px,calc(54 * var(--w)));padding:0 calc(28 * var(--w));min-width:calc(260 * var(--w));justify-content:center;border-radius:99px;background:var(--cream);color:var(--dark);font-weight:700;font-size:max(14px,calc(16 * var(--w)));transition:opacity .3s,background .3s}
#buy .bp{font:500 .92em 'DM Mono',monospace;opacity:.7}
#buy:disabled{opacity:.38;cursor:default}
#buy.done{background:#8fa8a3;opacity:1}

.flyer{position:fixed;z-index:70;pointer-events:none;background-repeat:no-repeat;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25))}

/* ---------- desktop short ---------- */
/* ---------- desktop: readable minimum sizes when the window is narrow ---------- */
.brand{font-size:max(13px,calc(15.5 * var(--n)))}
.mark{width:max(30px,calc(36 * var(--n)));height:max(30px,calc(36 * var(--n)))}
.pill a{height:max(30px,calc(34 * var(--n)));padding:0 max(13px,calc(19 * var(--n)));font-size:max(12.5px,calc(14.5 * var(--n)))}
.chip{height:max(32px,calc(37 * var(--n)));font-size:max(11.5px,calc(13 * var(--n)))}
.basket{width:max(38px,calc(44 * var(--n)))}
.dibs{height:max(32px,calc(37 * var(--n)));padding:0 max(14px,calc(18 * var(--n)));font-size:max(12.5px,calc(14.5 * var(--n)))}
.in-cap{font-size:max(14px,calc(11px / var(--k,1)))}
.shop-cap{font-size:max(12.5px,calc(15.5 * var(--w)))}
.th .tn{font-size:max(10px,calc(11 * var(--w)));white-space:normal;line-height:1.15;min-height:2.3em}
.th .tr{font-size:max(9px,calc(11 * var(--w)))}

@media (min-width:1024px) and (max-height:560px){
  /* short wide screens: counter and Autoplay sit in the bottom corners, clear of the arc */
  #count{top:auto;bottom:10px;right:24px;font-size:52px}
  #auto{top:auto;bottom:24px;right:auto;left:26px}
}

/* ---------- section 2 portrait frame (portrait-shaped compact screens; toggled from JS) ---------- */
.pframe .in-frame{width:390px;height:780px}
.pframe .in-head{left:16px;top:84px;font-size:40px}
.pframe .in-num{left:0;width:390px;top:250px;font-size:210px}
.pframe #inCan{left:125px;top:200px;width:140px;height:336px}
.pframe .in-icons{left:0;right:0;top:auto;bottom:118px;display:flex;justify-content:center;gap:10px}
.pframe .in-icons button{width:52px;height:52px}
.pframe .in-icons button svg{width:22px;height:22px}
.pframe .in-cap{left:0;right:0;top:auto;bottom:80px;text-align:center;font-size:max(11.5px,calc(11px / var(--k,1)))}

/* ---------- compact layout: phones, tablets, half-screen windows ---------- */
@media (max-width:1023.98px),(max-width:1365.98px) and (orientation:portrait){
  :root{--u:min(calc(100vw / 560), calc(100svh / 980))}
  #nav{height:64px;padding:0 16px}
  .brand{gap:9px;font-size:15px}
  .mark{width:32px;height:32px}
  .right{gap:8px}
  .chip{height:34px;font-size:12px}
  .basket{width:42px}
  .basket svg{width:18px;height:18px}
  .dibs{height:34px;padding:0 14px;font-size:13.5px}
  .off{display:none}
  .pill{position:fixed;top:auto;bottom:calc(14px + env(safe-area-inset-bottom));translate:-50% 0;background:rgba(255,255,255,.55);padding:4px}
  .pill a{height:34px;padding:0 13px;font-size:13.5px}
  .pill .hl{top:4px;bottom:4px}
  #nav.dark .pill{background:rgba(25,26,30,.55)}
  #title{top:auto;bottom:calc(120px + env(safe-area-inset-bottom));padding:0 18px;font-size:var(--ts,clamp(40px,12.5vw,64px))}
  #count{top:76px;right:14px;font-size:56px}
  #auto{top:142px;right:16px}
  #play{width:48px;height:48px;top:auto;bottom:calc(120px + env(safe-area-inset-bottom) + var(--th,64px) + 18px);translate:-50% 0}
  #play:hover{scale:1}
  .rings{width:1500px;height:1500px;background:repeating-radial-gradient(circle,rgba(255,255,255,.13) 0,rgba(255,255,255,.02) 30px,rgba(255,255,255,.13) 60px)}

      tilt.x = lerp(tilt.x, card._hover ? card._x : 0, tk); tilt.y = lerp(tilt.y, card._hover ? card._y : 0, tk);
      const C = { x: pr.left + pr.width / 2, y: pr.top + pr.height / 2, h: pr.height, rz: 0, ry: Math.round(B.ry / 360) * 360 + tilt.x * 14, rx: -tilt.y * 14, z: 30, op: 1, sx: 1, sy: 1, shadow: .7 };
      S = mixState(S, C, easeIO(p3));
      if (!stripCentered && isPhone()) {
        stripCentered = true;
        const cRect = card.getBoundingClientRect(), sRect = cardsEl.getBoundingClientRect();
        cardsEl.scrollTo({ left: cardsEl.scrollLeft + (cRect.left + cRect.width / 2) - (sRect.left + sRect.width / 2), behavior: RM ? 'auto' : 'smooth' });
      }
    }
  }
  if (poke3d >= 0) {
    const t = (now - poke3d) / 500;
    if (t >= 1) poke3d = -1;
    else { const [sx, sy] = pokeAt(t); S.sx = sx; S.sy = sy; S.y += (1 - sy) * S.h / 2; }
  }
  place(trav, S, fT, jT);

  // nav
  stepNav([hr, ir, sr, rr]);

  if (glReady) renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function mixState(a, b, t) {
  const o = {};
  for (const k of ['x', 'y', 'h', 'rz', 'ry', 'rx', 'z', 'op', 'shadow', 'sx', 'sy']) o[k] = lerp(a[k] ?? 0, b[k] ?? 0, t);
  return o;
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) lastInteract = performance.now(); });
requestAnimationFrame(frame);
</script>
